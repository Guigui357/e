      - name: Build IPA with xcodebuild
        run: |
          cd BadKernelTest
          xcodebuild -project BadKernelTest.xcodeproj \
            -scheme BadKernelTest \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            HEADER_SEARCH_PATHS="$(PWD)/../Bad-Kernel/headers" \
            LIBRARY_SEARCH_PATHS="$(PWD)/../Bad-Kernel" \
            OTHER_LDFLAGS="-L$(PWD)/../Bad-Kernel -lBadKernel" \
            build

      - name: Create IPA
        run: |
          cd BadKernelTest
          mkdir -p Payload
          cp -R ./build/Build/Products/Release-iphoneos/BadKernelTest.app Payload/
          zip -r BadKernelTest.ipa Payload
          ls -la BadKernelTest.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BadKernelTest-IPA
          path: BadKernelTest/BadKernelTest.ipa
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            BadKernelTest/build/Logs/
          retention-days: 7
