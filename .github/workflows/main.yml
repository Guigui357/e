# .github/workflows/build.yml
name: Build BadKernel IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Setup iOS SDK
        run: |
          echo "Available SDKs:"
          xcodebuild -showsdks
          echo "iOS SDK path:"
          xcrun --sdk iphoneos --show-sdk-path

      - name: Clone BadKernel
        run: |
          if [ ! -d "Bad-Kernel" ]; then
            git clone https://github.com/guigui357/Bad-Kernel.git Bad-Kernel
          fi
          ls -la Bad-Kernel/
          ls -la Bad-Kernel/headers/ || true
          ls -la Bad-Kernel/*.a || true

      - name: Build BadKernel library
        run: |
          cd Bad-Kernel
          if [ -f "Makefile" ]; then
            make clean || true
            make lib
          fi
          ls -la *.a || echo "No .a files found"
          ls -la *.o || echo "No .o files found"

      - name: Verify BadKernel artifacts
        run: |
          if [ ! -f "Bad-Kernel/libBadKernel.a" ]; then
            echo "[!] libBadKernel.a not found, attempting to build from source"
            cd Bad-Kernel
            find . -name "*.m" -o -name "*.c" | head -20
            # Try to compile manually if Makefile failed
            xcrun --sdk iphoneos clang -arch arm64 \
              -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
              -mios-version-min=14.0 \
              -O2 -fobjc-arc \
              -Iheaders \
              -c BadKernel/BadKernel.m \
              -o BadKernel.o
            ar rcs libBadKernel.a BadKernel.o
          fi
          ls -la Bad-Kernel/libBadKernel.a

      - name: Create Xcode project structure
        run: |
          mkdir -p BadKernelTest
          mkdir -p BadKernelTest/BadKernelTest
          mkdir -p BadKernelTest/BadKernelTest.xcodeproj

